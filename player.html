<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Player</title>
  <meta name="theme-color" content="#111111">
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Apple SD Gothic Neo, sans-serif; margin:0; background:#0b0b0b; color:#fff; display:flex; min-height:100vh; align-items:center; justify-content:center; }
    .card { max-width: 720px; padding: 28px; background:#151515; border-radius:16px; box-shadow: 0 8px 28px rgba(0,0,0,0.35); }
    h1 { margin-top:0; font-size: 1.4rem; }
    audio { width:100%; margin-top: 14px; }
    .muted { color:#bdbdbd; font-size:.95rem; line-height:1.5; }
    .row { display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; }
    a.btn, button { display:inline-block; text-decoration:none; background:#2b8eff; color:#fff; padding:12px 16px; border-radius:12px; border:none; cursor:pointer; }
    .warn { background:#ffcd39; color:#140f00; }
  </style>
</head>
<body>
  <!-- 오버레이: 잠금 해제 안내 -->
  <div id="overlay" style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);">
    <button id="unlock2" style="font-size:1.2rem;padding:14px 18px;border-radius:12px;border:0;cursor:pointer;">
      🔊 소리 켜기 (한 번만 터치)
    </button>
  </div>

  <div class="card">
    <h1 id="title">오디오 재생 준비…</h1>
    <p class="muted">QR 코드로 열린 페이지입니다. 곧바로 재생이 시작되지 않으면 한 번 눌러주세요.</p>
    <audio id="player" controls playsinline></audio>
    <div class="row">
      <a class="btn" href="index.html">홈</a>
      <button id="play" class="warn">▶️ 수동 재생</button>
    </div>
  </div>

<script>
(function(){
  // 요소 참조
  const audio = document.getElementById('player');
  const title = document.getElementById('title');
  const overlay = document.getElementById('overlay');
  const unlock2 = document.getElementById('unlock2');

  // URL 파라미터에서 id 파싱
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || 'demo';
  title.textContent = '트랙: ' + id;

  // 오디오 소스 지정
  audio.src = 'audio/' + encodeURIComponent(id) + '.mp3';

  // 자동재생 시도 함수
  function tryAutoplay() {
    // index.html에서 이미 언락했다면 바로 시도
    if (localStorage.getItem('audioUnlocked') === '1') {
      audio.play().catch(() => {
        // 언락되어 있어도 실패하면 오버레이 표시
        overlay.style.display = 'flex';
      });
    } else {
      // 언락 안 되어 있으면 오버레이 표시
      overlay.style.display = 'flex';
    }
  }

  // iOS 등에서 사용자 제스처로 오디오 권한 열기
  function unlockAndPlay() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      const buf = ctx.createBuffer(1, 1, 22050);
      const src = ctx.createBufferSource();
      src.buffer = buf; src.connect(ctx.destination); src.start(0);
      localStorage.setItem('audioUnlocked', '1');
    } catch (e) {
      console.log('Unlock error:', e);
    }
    audio.play().finally(() => overlay.style.display = 'none');
  }

  // 이벤트 바인딩
  unlock2.addEventListener('click', unlockAndPlay);
  document.getElementById('play').addEventListener('click', () => audio.play());

  // 첫 진입 및 가시성 변화 때 재시도
  tryAutoplay();
  document.addEventListener('visibilitychange', () => {
    if (!audio.paused) return;
    tryAutoplay();
  });
})();
</script>
</body>
</html>
